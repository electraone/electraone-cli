name: CI

on:
  push:
  pull_request:

jobs:
  format-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # Ubuntu's apt package for clang-format tracks whatever version the
      # runner image ships (drifts over time and across Jammy/Noble images),
      # which can format the same .clang-format config differently from a
      # contributor's local install and fail this check on formatting that
      # is actually fine. Pin the exact version via the clang-format PyPI
      # package (prebuilt binary wheels) instead, matching the version used
      # to format this repo - bump both together if either changes.
      - name: Install clang-format
        run: python3 -m pip install --break-system-packages clang-format==19.1.1

      - name: Check formatting
        run: make format-check

  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Install Linux MIDI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure -C Release
